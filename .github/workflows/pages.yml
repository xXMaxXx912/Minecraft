# Veröffentlicht die iPhone-App (Ordner iphone/) auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
# Alle Actions sind auf einen festen Commit-SHA gepinnt (Sicherheitsrichtlinie des Repositorys).
# Erlaubt sein müssen: von GitHub erstellte Actions (Settings → Actions → General).
name: iPhone-App veröffentlichen

on:
  push:
    branches: [claude/18-plus-chatbot-c4i5jh, main]
    paths: ["iphone/**", "safety.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node ist auf ubuntu-latest vorinstalliert – keine weitere Action nötig
      - run: node --version && npm ci
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/data

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: iphone
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
